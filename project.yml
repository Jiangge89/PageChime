name: PageChime
options:
  bundleIdPrefix: com.pagechime
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  PageChime:
    type: application
    platform: iOS
    sources:
      - path: PageChime
        excludes:
          - "Resources/Sounds/ATTRIBUTION.md"
    resources:
      - path: PageChime/Resources/Sounds
        buildPhase: resources
    settings:
      base:
        INFOPLIST_FILE: PageChime/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.pagechime.app
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: GY7SG2DH82
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "PageChime listens to your storytelling to play matching sound effects. Your voice is processed during the reading session and is never saved."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "PageChime uses speech recognition to detect story events like animals, weather, and actions, so it can play matching sounds. Transcripts are not saved."
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"

  PageChimeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PageChimeTests
    dependencies:
      - target: PageChime
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pagechime.tests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/PageChime.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/PageChime"
        BUNDLE_LOADER: "$(TEST_HOST)"
